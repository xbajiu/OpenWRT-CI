# SPDX-License-Identifier: MIT
name: Sync-Upstream

on:
  # 自动同步：每2天定时执行
  schedule:
    - cron: "21 5 */2 * *"
  # 手动一键同步
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync with VIKINGYFY/OpenWRT-CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and Fetch Upstream
        run: |
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git 2>/dev/null || true
          git fetch upstream main

      - name: Merge Upstream Changes
        run: |
          LOCAL_HEAD=$(git rev-parse HEAD)
          echo "LOCAL_HEAD=$LOCAL_HEAD" >> "$GITHUB_ENV"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with VIKINGYFY/OpenWRT-CI."
            exit 0
          fi

          # 尝试平滑合并上游更新（暂不提交，先恢复私有文件与钩子）
          if git merge --no-commit --no-ff upstream/main; then
            echo "Merged upstream changes cleanly."
          else
            echo "Notice: Merge conflict detected, resolving with upstream base and restoring private overrides..."
            git merge --abort || true
            git merge --no-commit --no-ff -X theirs upstream/main || true
          fi

          # 1. 强制保护私有文件与自定义工作流配置不被上游覆盖或删除
          PROTECTED_FILES=(
            "Scripts/PRIVATE.sh"
            "Config/PRIVATE.txt"
            "plugin-selector.html"
            ".github/workflows/Sync-Upstream.yml"
            ".github/workflows/QCA-ALL.yml"
            ".github/workflows/Auto-Clean.yml"
            ".github/workflows/AIROHA-ALL.yml"
            ".github/workflows/MTK-ALL.yml"
            ".github/workflows/OWRT-ALL.yml"
            ".github/workflows/QCB-ALL.yml"
          )
          git checkout "$LOCAL_HEAD" -- "${PROTECTED_FILES[@]}"

          # 2. 确保 Scripts/Packages.sh 始终包含 PRIVATE.sh 加载钩子
          if ! grep -q 'Scripts/PRIVATE.sh' Scripts/Packages.sh; then
            printf '\n#引入私有扩展脚本\nif [ -f "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh" ]; then\n\tsource "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh"\nfi\n' >> Scripts/Packages.sh
          fi

          # 3. 确保 Scripts/Settings.sh 始终包含 PRIVATE.txt 加载钩子
          if ! grep -q 'Config/PRIVATE.txt' Scripts/Settings.sh; then
            printf '\n#引入私有扩展配置\nif [ -f "$GITHUB_WORKSPACE/Config/PRIVATE.txt" ]; then\n\techo "Applying private configurations from PRIVATE.txt..."\n\tcat $GITHUB_WORKSPACE/Config/PRIVATE.txt >> ./.config\nfi\n' >> Scripts/Settings.sh
          fi

          git add -A
          if ! git diff --cached --quiet || [ -f .git/MERGE_HEAD ]; then
            git commit -m "chore: 自动同步上游 VIKINGYFY/OpenWRT-CI 并锁定私有配置"
          fi

      - name: Push to Origin
        run: |
          if git push origin main; then
            echo "Pushed synced changes to origin/main."
          else
            echo "Notice: Push rejected (likely due to GITHUB_TOKEN workflow file restriction); keeping local .github/workflows and retrying..."
            git checkout "$LOCAL_HEAD" -- .github/workflows
            if ! git diff --cached --quiet || ! git diff --quiet; then
              git add .github/workflows
              git commit --amend --no-edit
            fi
            git push origin main
          fi
